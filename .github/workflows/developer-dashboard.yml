name: Developer Dashboard

on:
  push:
    paths:
      - "apps/client/**"
      - "src/developer-auth/**"
      - ".github/workflows/developer-dashboard.yml"
  pull_request:
    paths:
      - "apps/client/**"
      - "src/developer-auth/**"
      - ".github/workflows/developer-dashboard.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
